[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeflow"
version = "0.1.0"
description = "Local, evidence-first enterprise workflow runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pyyaml>=6,<7",
  "mcp==1.30.0", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/api.py" = ["B008"] # FastAPI dependency declarations are evaluated once intentionally.
